title: Sound Visualiser
summary: Browser audio-reactive WebGL visualizer that turns music into 3D scenes and webcam effects.
description: >
  Sound Visualiser listens to your microphone, an uploaded track, or a demo song and
  drives full-screen WebGL visuals in real time. It extracts loudness, spectral flux,
  and bass/mid/high energy, then maps those signals to camera moves, particles,
  lighting, and custom shaders. You can switch between a cinematic 3D scene, a live
  webcam feed, and an acid-style feedback mode, with optional beat sync when the
  rhythm is clear.
stack:
  - TypeScript
  - Vite
  - Three.js
  - GLSL
  - Meyda
  - GSAP
  - Web Audio API
status: active
links:
  github: https://github.com/aryanjohari/sound-visualiser
  demo: https://music.arkhives.nz
