title: Sound Visualiser
summary: Browser look instrument — live WebGL follows the beat; looks are reloadable JSON; Keep saves a 30s local clip of the canvas plus soundtrack.
description: >
  Sound Visualiser is a browser-only look instrument. Play a track (file, microphone, or
  demo), optionally add a webcam, and a full-screen WebGL look follows energy, mood, and
  beat-with-confidence. Three looks are built in: a cinematic 3D scene, a sharp reactive
  webcam feed, and an acid mode that feeds each frame back into the next. The look is a
  closed JSON document (schemaVersion 1: look, sync, and axes) you can download and reload
  on a new track. Keep records up to 30 seconds of the canvas plus soundtrack in the tab
  (the HUD stays out of the pixels); silent clips fail closed, and nothing is uploaded.
  There is no backend and no talk API on this wrap.
stack:
  - TypeScript
  - Vite
  - Three.js
  - GLSL
  - Web Audio API
  - Meyda
  - GSAP
status: active
