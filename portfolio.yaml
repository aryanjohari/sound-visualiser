title: Sound Visualiser
summary: WebGL music visualizer that maps live audio to 3D shaders, camera motion, and particle effects in real time.
description: >
  A browser-based audio visualizer that turns music into moving 3D graphics.
  Load a track, use your microphone, or try the built-in demos — the app reads
  loudness and frequency bands and drives camera moves, a fluid background,
  particle knots, lighting, and color shifts in sync with the beat. Peaks are
  smoothed and self-calibrate to each track so the motion feels musical rather
  than jittery. Built for anyone curious how audio features connect to real-time
  WebGL rendering.
stack:
  - TypeScript
  - Vite
  - Three.js
  - GLSL
  - Meyda
  - GSAP
  - postprocessing
status: active
